apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-go-api-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: go-api
  ports:
    - protocol: TCP
      port: {{ .Values.goApi.service.port }}
      targetPort: {{ .Values.goApi.service.port }}
  type: {{ .Values.goApi.service.type }}
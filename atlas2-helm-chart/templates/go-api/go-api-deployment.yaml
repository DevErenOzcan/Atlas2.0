apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-go-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: go-api
spec:
  replicas: {{ .Values.goApi.replicaCount }}
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      {{- if .Values.goApi.waitForDb.enabled }}
      initContainers:
        - name: wait-for-mysql
          image: "{{ .Values.goApi.waitForDb.image.repository }}:{{ .Values.goApi.waitForDb.image.tag }}"
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for MySQL to be ready..."
              until mysqladmin ping -h mysql-service --silent; do
                echo "MySQL is not ready yet. Waiting..."
                sleep 2
              done
              echo "MySQL port is open, now testing database connection..."
              until mysql -h mysql-service -u ${DB_USER} -p${DB_PASSWORD} -e "SELECT 1" ${DB_NAME} > /dev/null 2>&1; do
                echo "MySQL database is not ready yet. Waiting..."
                sleep 2
              done
              echo "MySQL is fully ready!"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DB_PASSWORD
      {{- end }}
      containers:
        - name: go-api
          image: "{{ .Values.goApi.image.repository }}:{{ .Values.goApi.image.tag }}"
          imagePullPolicy: {{ .Values.goApi.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.goApi.service.port }}
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: JWT_SECRET
            - name: CORS_ALLOW_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: CORS_ALLOW_ORIGINS
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: BACKEND_PORT
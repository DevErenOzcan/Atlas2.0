{{- with .Values.gateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas2-helm-chart.fullname" $ }}-{{ .name }}
  labels:
    {{- include "atlas2-helm-chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      {{- include "atlas2-helm-chart.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "atlas2-helm-chart.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
      {{- if .metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .metrics.port | default .service.port }}"
        prometheus.io/path: "{{ .metrics.path }}"
      {{- end }}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .service.port }}
              protocol: TCP
          env:
            - name: USER_SERVICE_ADDR
              value: "{{ .userSvcAddr }}"
            - name: PRODUCT_SERVICE_ADDR
              value: "{{ .productSvcAddr }}"
            - name: ORDER_SERVICE_ADDR
              value: "{{ .orderSvcAddr }}"
{{- end }}

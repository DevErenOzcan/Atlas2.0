apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: ollama
spec:
  type: {{ .Values.ollama.service.type }}
  selector:
    app: ollama
  ports:
    - name: http
      port: {{ .Values.ollama.service.port }}
      targetPort: {{ .Values.ollama.service.port }}
      protocol: TCP
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.config.global.scrape_interval }}
      evaluation_interval: {{ .Values.prometheus.config.global.evaluation_interval }}
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['{{ .Release.Name }}-prometheus-service:{{ .Values.prometheus.service.port }}']
        metrics_path: '/prometheus/metrics'

      - job_name: 'todolist-backend'
        static_configs:
          - targets: ['{{ .Release.Name }}-go-api-service:{{ .Values.goApi.service.port }}']
        metrics_path: '/metrics'
        scrape_interval: 30s

      - job_name: 'todolist-frontend-blackbox'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - {{ printf "%s://%s-react-app-service:%d" .Values.prometheus.config.frontendScrape.scheme .Release.Name .Values.reactApp.service.port }}
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: {{ .Release.Name }}-blackbox-exporter-service:{{ .Values.blackboxExporter.service.port }}

      - job_name: 'blackbox-exporter'
        static_configs:
          - targets: ['{{ .Release.Name }}-blackbox-exporter-service:{{ .Values.blackboxExporter.service.port }}']

      - job_name: 'db-exporter'
        static_configs:
          - targets: ['{{ .Release.Name }}-db-exporter-service:{{ .Values.dbExporter.service.port }}']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['{{ .Release.Name }}-node-exporter-service:{{ .Values.nodeExporter.service.port }}']
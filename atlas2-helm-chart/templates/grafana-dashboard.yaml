{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboard
  labels:
    {{- include "atlas2-helm-chart.labels" . | nindent 4 }}
    grafana_dashboard: "1"
spec:
  data:
    atlas2-dashboard.json: |
      {
        "__inputs": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "description": "",
            "type": "datasource",
            "pluginId": "prometheus",
            "pluginName": "Prometheus"
          }
        ],
        "__requires": [
          {
            "type": "grafana",
            "id": "grafana",
            "name": "Grafana",
            "version": "7.0.0"
          },
          {
            "type": "panel",
            "id": "graph",
            "name": "Graph",
            "version": ""
          },
          {
            "type": "datasource",
            "id": "prometheus",
            "name": "Prometheus",
            "version": "1.0.0"
          }
        ],
        "annotations": {
          "list": [
            {
              "builtIn": 1,
              "datasource": "-- Grafana --",
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "type": "dashboard"
            }
          ]
        },
        "editable": true,
        "gnetId": null,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "panels": [
          {
            "datasource": "${DS_PROMETHEUS}",
            "gridPos": {
              "h": 9,
              "w": 12,
              "x": 0,
              "y": 0
            },
            "id": 2,
            "targets": [
              {
                "expr": "sum(go_goroutines{job=~\"user|product|order\"}) by (job)",
                "legendFormat": "{{`{{`}} job {{`}}`}}",
                "refId": "A"
              }
            ],
            "title": "Goroutines",
            "type": "graph"
          },
          {
            "datasource": "${DS_PROMETHEUS}",
            "gridPos": {
              "h": 9,
              "w": 12,
              "x": 12,
              "y": 0
            },
            "id": 4,
            "targets": [
              {
                "expr": "sum(go_memstats_heap_alloc_bytes{job=~\"user|product|order\"}) by (job)",
                "legendFormat": "{{`{{`}} job {{`}}`}}",
                "refId": "A"
              }
            ],
            "title": "Heap Allocations",
            "type": "graph"
          },
          {
            "datasource": "${DS_PROMETHEUS}",
            "gridPos": {
              "h": 9,
              "w": 12,
              "x": 0,
              "y": 9
            },
            "id": 6,
            "targets": [
              {
                "expr": "sum(rate(go_gc_duration_seconds_sum{job=~\"user|product|order\"}[5m])) by (job)",
                "legendFormat": "{{`{{`}} job {{`}}`}}",
                "refId": "A"
              }
            ],
            "title": "GC Duration",
            "type": "graph"
          }
        ],
        "schemaVersion": 26,
        "style": "dark",
        "tags": [],
        "templating": {
          "list": []
        },
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "timepicker": {},
        "timezone": "",
        "title": "Atlas2 Dashboard",
        "uid": "atlas2-dashboard",
        "version": 2
      }
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-datasources
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ tpl .Values.grafana.config.datasources.url . }}
        uid: prometheus
        isDefault: true
        editable: true
        jsonData:
          tlsSkipVerify: true
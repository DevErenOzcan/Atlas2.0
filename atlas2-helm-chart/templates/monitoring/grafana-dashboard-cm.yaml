{{- /* Provision Grafana dashboard via ConfigMap so kube-prometheus-stack Grafana sidecar picks it up */ -}}
{{- $root := . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atlas2-helm-chart.fullname" $root }}-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    {{- include "atlas2-helm-chart.labels" $root | nindent 4 }}
    release: kube-prometheus-stack
data:
  atlas2-dashboard.json: |
{{ .Files.Get "files/atlas2-dashboard.json" | indent 4 }}


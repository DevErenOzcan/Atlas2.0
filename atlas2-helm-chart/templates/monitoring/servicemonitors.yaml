{{- /* ServiceMonitor resources for scraping metrics via Prometheus Operator */ -}}
{{- $root := . -}}

{{- with .Values.user }}
{{- if and .metrics.enabled .metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "atlas2-helm-chart.fullname" $root }}-user
  labels:
    {{- include "atlas2-helm-chart.labels" $root | nindent 4 }}
    app.kubernetes.io/component: user
    {{- range $k, $v := .metrics.serviceMonitor.labels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "atlas2-helm-chart.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: user
  endpoints:
    - port: metrics
      path: {{ .metrics.path | default "/metrics" }}
      interval: {{ .metrics.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .metrics.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
{{- end }}


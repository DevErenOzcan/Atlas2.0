apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-flask-analytics-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: flask-analytics
spec:
  selector:
    app: flask-analytics
  ports:
    - name: http
      port: {{ .Values.flaskAnalytics.service.port }}
      targetPort: {{ .Values.flaskAnalytics.service.port }}
      protocol: TCP
  type: {{ .Values.flaskAnalytics.service.type }}